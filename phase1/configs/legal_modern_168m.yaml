model:
  vocab_size: 32000
  d_model: 896
  n_layers: 16
  n_query_heads: 14
  n_kv_heads: 2
  head_dim: 64
  d_ff: 2560
  context_length: 4096
  rmsnorm_eps: 0.00001
  rope_theta: 10000
  dropout: 0.05
  tied_token_embeddings: true
  parameters: 168162176
training:
  optimizer: AdamW
  learning_rate: 0.0003
  betas: [0.9, 0.95]
  weight_decay: 0.1
  gradient_clip_norm: 1.0
  warmup_ratio: 0.02
  schedule: cosine
  min_lr_ratio: 0.1
  precision: bf16
  physical_gpu_ids: [7, 4, 2, 1]
  per_gpu_batch: 8
  grad_accum: 1
  tokens_per_update: 131072
  eval_every_steps: 1000
  save_every_steps: 1000
  validation_tokens: 5000000
  periodic_validation_tokens: 1000000
